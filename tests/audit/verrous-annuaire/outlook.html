<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Courrier - Outlook</title>
<!--
  Fausse page « nouvel Outlook web » (FR) pour l'audit « verrous entre relevé et envoi,
  annuaire commun, Déjà envoyés ». Fidèle à la fiche de référence quand on sait :
    - champ « À » : div[aria-label="À"][contenteditable=true] ; pastilles DANS le champ
      (span._Entity._EType_RECIPIENT_ENTITY contenteditable=false, id REK…, aria-label « offline<NOM> »)
      entourées d'espaces de largeur nulle ; la pastille montre le NOM si le contact est connu ;
    - libellés « À » / « Cc » / « Cci » = BOUTONS qui ouvrent le carnet d'adresses (piège) ;
    - Objet : input[aria-label="Objet"][placeholder="Ajouter un objet"] ;
    - Corps : div[role=textbox][aria-label="Corps du message"] avec la signature dedans ;
    - Envoyer : button[aria-label="Envoyer"] + « Autres options d'envoi » ; « Abandonner » (pas « Ignorer ») ;
    - ruban « Message » avec « Importance élevée » (aria-pressed false → true) ;
    - liste des messages = [role=listbox] « Liste des messages » qui contient des adresses ;
    - barre de recherche role=combobox dans role=search.
  Variantes PLAUSIBLES (non vérifiées sur le vrai Outlook, dites comme telles) :
    - la rédaction met DELAI ms à s'ouvrir après « Nouveau message » (paramètre ?delai=) ; un 2e clic
      pendant l'ouverture, ou rédaction déjà ouverte, est ignoré ;
    - à l'envoi, une pastille non valide (texte qui n'est pas une adresse) ou du texte non validé
      dans « À » bloque l'envoi : barre d'erreur, rédaction ouverte (Outlook signale les noms non résolus) ;
    - liste de suggestions « portalisée » (hors de la rédaction), 5 contacts puis
      « Afficher plus de résultats » ;
    - option __cfg.fermetureEnvoi : le mail part au clic sur « Envoyer » mais la rédaction met du temps à se
      refermer (complément, réseau lent) — l'issue est alors incertaine pour l'extension.
  Journal pour les tests : window.__journal (frappes, saisies, clics, focus), html[data-envoyes],
  et chaque mail « envoyé » est aussi rapporté par POST /__test/envoi (intercepté par context.route :
  rien ne sort), pour compter les envois de tous les onglets, rechargements compris.
-->
<style>
  body { font-family: "Segoe UI", sans-serif; margin: 0; font-size: 14px; }
  header { display: flex; gap: 8px; align-items: center; padding: 6px 10px; background: #0f6cbd; color: #fff; }
  header input { width: 320px; }
  #ruban { padding: 4px 10px; border-bottom: 1px solid #ddd; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; max-width: 820px; }
  #principal { display: flex; }
  #liste { width: 190px; border-right: 1px solid #ddd; font-size: 12px; }
  #lecture { width: 620px; padding: 10px; }
  .ligne { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
  .champ { border: 1px solid #ccc; min-height: 22px; padding: 3px; flex: 1; }
  ._Entity { background: #eef; border-radius: 8px; padding: 1px 6px; margin: 0 2px; }
  ._Entity[data-invalide] { background: #fdd; text-decoration: underline wavy red; }
  #sugg { position: absolute; background: #fff; border: 1px solid #999; z-index: 1000; width: 380px; box-shadow: 0 4px 12px rgba(0,0,0,.2); }
  #sugg[hidden] { display: none; }
  #sugg [role=option] { padding: 3px 6px; display: flex; gap: 8px; }
  #corps { min-height: 140px; border: 1px solid #ccc; padding: 6px; }
  #barre-erreur { background: #fde7e9; color: #a4262c; padding: 4px 8px; margin: 4px 0; }
  #barre-erreur:empty { display: none; }
  .modale { position: fixed; left: 20%; top: 20%; width: 420px; height: 260px; background: #fff; border: 1px solid #333; z-index: 900; padding: 10px; }
</style>
</head>
<body>
<header role="banner">
  <div role="search"><input type="text" role="combobox" aria-label="Recherchez des e-mails, des réunions, des fichiers et plus encore." placeholder="Rechercher"></div>
  <button type="button" aria-label="Conversation Teams">Teams</button>
  <button type="button" aria-label="Ma journée">Ma journée</button>
  <button type="button" aria-label="Paramètres">⚙</button>
</header>
<div id="ruban" role="toolbar" aria-label="Ruban">
  <div role="tablist" id="onglets-ruban"></div>
  <div id="commandes"></div>
</div>
<div id="principal">
  <div role="listbox" aria-label="Liste des messages" id="liste">
    <div role="option">Apple — Vous n'obtenez pas souvent d'e-mail à partir de noreply@email.apple.com</div>
    <div role="option">Scolarité — scolarite@exemple.fr : planning du semestre</div>
    <div role="option"><button type="button" aria-label="Marquer comme non lu">✉</button> Bureau des élèves — bde@exemple.fr</div>
  </div>
  <div id="lecture"></div>
</div>
<div id="sugg" role="listbox" aria-label="Suggestions de contacts" hidden></div>
<script>
(function () {
  "use strict";
  var P = new URLSearchParams(location.search);
  var ONGLET = P.get("onglet") || "A";
  var RAPIDE = document.documentElement.dataset.ppTest === "rapide";
  var DELAI = Number(P.get("delai") || (RAPIDE ? 40 : 600));
  var cfg = window.__cfg = {
    collageEnTrop: false,   // un « complément » ajoute du texte au collage du corps (garde-fou du Publipostage)
    envoiBloque: false,     // « Envoyer » ne referme pas la rédaction (fenêtre de politique, complément…)
    aCollerIgnore: false,
    fermetureEnvoi: 0       // ms avant que la rédaction se referme après « Envoyer » (mail déjà parti) : envoi lent, complément
  };
  var journal = window.__journal = { frappes: [], saisies: [], clics: [], focus: [], redactions: 0 };
  window.envoyes = [];
  function publier() { document.documentElement.dataset.envoyes = JSON.stringify(window.envoyes); }
  publier();
  function rapporter(type, donnees) {
    try { fetch("/__test/" + type + "?onglet=" + encodeURIComponent(ONGLET), { method: "POST", body: JSON.stringify(donnees), keepalive: true }); } catch (e) {}
  }

  // ------------------------------------------------------------ carnet (suggestions)
  var CARNET = [
    ["Martin Dupont", "martin.dupont@exemple.fr"], ["Marie Martin", "marie.martin@exemple.fr"], ["Martine Lefevre", "martine.lefevre@exemple.eu"],
    ["Mathis Moreau", "mathis.moreau@exemple.fr"], ["Maxime Marchand", "maxime.marchand@exemple.eu"], ["Manon Mercier", "manon.mercier@exemple.fr"],
    ["Antoine Quesnel", "antoine.quesnel@exemple.eu"], ["Anne-Laure Gautier", "anne-laure.gautier@exemple.fr"], ["Alexandre Delmas", "alexandre.delmas@exemple.eu"],
    ["Amandine Ferrand", "amandine.ferrand@exemple.eu"], ["Adele Perrin", "adele.perrin@exemple.fr"], ["Baptiste Rousseau", "baptiste.rousseau@exemple.com"],
    ["Camille Bernard", "camille.bernard@exemple.fr"], ["Christelle Dubois", "christelle.dubois@exemple.fr"], ["David Lambert", "david.lambert@exemple.edu"],
    ["Emma Girard", "emma.girard@exemple.fr"], ["Fanny Lopez", "fanny.lopez@exemple.eu"], ["Gabriel Roux", "gabriel.roux@exemple.fr"],
    ["Hugo Fontaine", "hugo.fontaine@exemple.eu"], ["Ines Vincent", "ines.vincent@exemple.fr"], ["Julie Henry", "julie.henry@exemple.fr"],
    ["Kevin Masson", "kevin.masson@exemple.eu"], ["Laura Simon", "laura.simon@exemple.fr"], ["Nicolas Michel", "nicolas.michel@exemple.eu"],
    ["Olivia Garcia", "olivia.garcia@exemple.fr"], ["Paul Robert", "paul.robert@exemple.eu"], ["Quentin Faure", "quentin.faure@exemple.fr"],
    ["Romain Blanc", "romain.blanc@exemple.eu"], ["Sophie Guerin", "sophie.guerin@exemple.fr"], ["Thomas Petit", "thomas.petit@exemple.edu"],
    ["Ugo Chevalier", "ugo.chevalier@exemple.fr"], ["Valentin Leroy", "valentin.leroy@exemple.eu"], ["Xavier Noel", "xavier.noel@exemple.fr"],
    ["Yanis Perez", "yanis.perez@exemple.eu"], ["Zoe Fabre", "zoe.fabre@exemple.fr"]
  ];
  var NOMS = {}; CARNET.forEach(function (c) { NOMS[c[1]] = c[0].toUpperCase(); });
  function mots(s) { return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").split(/[^a-z0-9]+/).filter(Boolean); }
  function chercher(q) {
    var qw = mots(q);
    if (!qw.length) return [];
    return CARNET.filter(function (c) { var t = mots(c[0] + " " + c[1]); return qw.every(function (w) { return t.some(function (x) { return x.indexOf(w) === 0; }); }); });
  }
  var sugg = document.getElementById("sugg"), suggTout = false;
  function masquerSugg() { sugg.hidden = true; sugg.innerHTML = ""; suggTout = false; }
  function suggerer(champ, q) {
    var r = chercher(q);
    if (!q || !r.length) { masquerSugg(); return; }
    var montres = suggTout ? r.slice(0, 20) : r.slice(0, 5);
    sugg.innerHTML = "";
    montres.forEach(function (c) {
      var o = document.createElement("div"); o.setAttribute("role", "option"); o.setAttribute("aria-label", c[0] + " " + c[1]);
      var n = document.createElement("span"); n.textContent = c[0];
      var m = document.createElement("span"); m.textContent = c[1];
      o.appendChild(n); o.appendChild(m);
      o.addEventListener("mousedown", function (e) { e.preventDefault(); });
      o.addEventListener("click", function () { journal.clics.push({ cible: "suggestion " + c[1], confiance: true }); });
      sugg.appendChild(o);
    });
    if (r.length > montres.length) {
      var plus = document.createElement("div"); plus.setAttribute("role", "button"); plus.tabIndex = -1; plus.textContent = "Afficher plus de résultats";
      plus.addEventListener("click", function () { suggTout = true; suggerer(champ, q); });
      sugg.appendChild(plus);
    }
    var b = champ.getBoundingClientRect();
    sugg.style.left = Math.round(b.left + window.scrollX) + "px"; sugg.style.top = Math.round(b.bottom + window.scrollY + 2) + "px";
    sugg.hidden = false;
  }

  // ------------------------------------------------------------ journal
  function zone(el) {
    if (!el || !el.closest) return "?";
    if (el.closest('[data-testid="ao-panel"],[data-pp-panneau]')) return "panneau";
    var c = el.closest("[data-champ]"); if (c) return c.dataset.champ;
    if (el.closest('[role="search"]')) return "recherche";
    if (el.closest("#liste")) return "liste";
    return "autre";
  }
  document.addEventListener("keydown", function (e) { journal.frappes.push({ zone: zone(e.target), key: e.key, confiance: e.isTrusted, t: Date.now() }); }, true);
  document.addEventListener("input", function (e) { journal.saisies.push({ zone: zone(e.target), inputType: e.inputType, data: e.data, confiance: e.isTrusted, t: Date.now() }); }, true);
  document.addEventListener("click", function (e) {
    var b = e.target && e.target.closest && e.target.closest('button,[role="button"],[role="tab"],[role="menuitem"],[role="option"]');
    if (!b || zone(b) === "panneau") return;
    journal.clics.push({ cible: (b.getAttribute("aria-label") || b.textContent || "").trim().slice(0, 60), id: b.id || "", confiance: e.isTrusted, t: Date.now() });
  }, true);
  document.addEventListener("focusin", function (e) { journal.focus.push({ zone: zone(e.target), t: Date.now() }); }, true);

  // ------------------------------------------------------------ ruban
  var ongletsRuban = document.getElementById("onglets-ruban"), commandes = document.getElementById("commandes");
  var importance = "normale";
  function bouton(lib, attrs) {
    var b = document.createElement("button"); b.type = "button"; b.textContent = lib; b.setAttribute("aria-label", lib);
    Object.keys(attrs || {}).forEach(function (k) { b.setAttribute(k, attrs[k]); });
    return b;
  }
  function rubanAccueil() {
    ongletsRuban.innerHTML = ""; commandes.innerHTML = "";
    ["Accueil", "Afficher", "Aide"].forEach(function (t, i) { ongletsRuban.appendChild(bouton(t, { role: "tab", "aria-selected": String(i === 0) })); });
    var nv = bouton("Nouveau message", { id: "nouveau" });
    nv.addEventListener("click", nouveauMessage);
    commandes.appendChild(nv);
    ["Supprimer", "Archiver", "Répondre"].forEach(function (t) { commandes.appendChild(bouton(t)); });
  }
  function rubanMessage() {
    ongletsRuban.innerHTML = ""; commandes.innerHTML = "";
    ["Accueil", "Afficher", "Aide", "Message", "Insérer", "Mettre le texte en forme", "Dessiner", "Options"].forEach(function (t) {
      ongletsRuban.appendChild(bouton(t, { role: "tab", "aria-selected": String(t === "Message") }));
    });
    var nv = bouton("Nouveau message", { id: "nouveau" });
    nv.addEventListener("click", nouveauMessage);
    commandes.appendChild(nv);
    ["Carnet d'adresses", "Vérifier les noms", "Joindre un fichier", "Lien", "Signature", "Enregistrer"].forEach(function (t) { commandes.appendChild(bouton(t)); });
    var imp = bouton("Importance élevée", { "aria-pressed": "false", id: "imp-haute" });
    imp.addEventListener("click", function () { importance = importance === "haute" ? "normale" : "haute"; imp.setAttribute("aria-pressed", String(importance === "haute")); });
    commandes.appendChild(imp);
    commandes.appendChild(bouton("Importance faible", { "aria-pressed": "false" }));
    commandes.appendChild(bouton("Autres options", { id: "RibbonOverflowMenu-overflow" }));
  }
  rubanAccueil();

  // ------------------------------------------------------------ carnet d'adresses (piège des libellés)
  function ouvrirCarnet() {
    if (document.getElementById("carnet")) return;
    var d = document.createElement("div"); d.id = "carnet"; d.className = "modale";
    d.setAttribute("role", "dialog"); d.setAttribute("aria-modal", "true"); d.setAttribute("aria-label", "Ajouter des destinataires");
    d.innerHTML = '<p>Ajouter des destinataires</p><button type="button" aria-label="Annuler" id="carnet-annuler">Annuler</button>';
    document.body.appendChild(d);
    d.querySelector("#carnet-annuler").addEventListener("click", function () { d.remove(); });
  }

  // ------------------------------------------------------------ rédaction
  var compteur = 0, ouverture = null, n = 0;
  function nouveauMessage() {
    if (document.getElementById("compose") || ouverture) return; // déjà ouverte, ou en cours d'ouverture
    ouverture = setTimeout(function () { ouverture = null; ouvrir(); }, DELAI);
  }
  function adresseValide(a) { return /^[A-Za-z0-9._%+'\-]+@[A-Za-z0-9\-]+(\.[A-Za-z0-9\-]+)*\.[A-Za-z]{2,}$/.test(a); }
  function ajouterPastille(champ, adr) {
    var nom = NOMS[adr.toLowerCase()] || adr;
    var p = document.createElement("span");
    p.id = "REK" + String(++compteur).padStart(5, "0");
    p.className = "_Entity _EType_RECIPIENT_ENTITY _EReadonly_1 Lbs4W";
    p.contentEditable = "false"; p.draggable = true;
    p.setAttribute("aria-label", "offline" + nom);
    p.dataset.adresse = adr;
    if (!adresseValide(adr)) p.dataset.invalide = "1";
    var w = document.createElement("span"); w.className = "lpcWrapper";
    var pill = document.createElement("span"); pill.className = "pill-222 validPill-223";
    var pres = document.createElement("span"); pres.id = "presenceIcon"; pres.setAttribute("role", "img"); pres.setAttribute("aria-label", "offline");
    var t = document.createElement("span"); t.textContent = nom;
    pill.appendChild(pres); pill.appendChild(t); w.appendChild(pill); p.appendChild(w);
    champ.appendChild(document.createTextNode("​"));
    champ.appendChild(p);
    champ.appendChild(document.createTextNode("​"));
  }
  function champDestinataires(champ, avecSuggestions) {
    function textes() { return [].filter.call(champ.childNodes, function (x) { return x.nodeType === 3; }); }
    function libre() { return textes().map(function (x) { return x.nodeValue; }).join("").replace(/​/g, ""); }
    champ.addEventListener("input", function () {
      var t = libre();
      if (/[;,]/.test(t)) {
        textes().forEach(function (x) { x.remove(); });
        t.split(/[;,]/).map(function (s) { return s.trim(); }).filter(Boolean).forEach(function (a) { ajouterPastille(champ, a); });
        masquerSugg();
        return;
      }
      if (avecSuggestions) suggerer(champ, t.trim());
    });
    champ.addEventListener("paste", function (e) {
      if (cfg.aCollerIgnore) return;
      var t = e.clipboardData && e.clipboardData.getData("text/plain");
      if (!t) return;
      e.preventDefault();
      if (/[;,]/.test(t)) t.split(/[;,]/).map(function (s) { return s.trim(); }).filter(Boolean).forEach(function (a) { ajouterPastille(champ, a); });
      else document.execCommand("insertText", false, t);
    });
    champ.addEventListener("blur", function () { setTimeout(function () { if (document.activeElement !== champ) masquerSugg(); }, 150); });
  }
  function ouvrir() {
    n++; journal.redactions++;
    var lecture = document.getElementById("lecture");
    lecture.innerHTML =
      '<div id="compose" role="region" aria-label="Rédaction du message" data-n="' + n + '">' +
      '<div class="ligne">' +
        '<button type="button" id="splitButton-r200__primaryActionButton" aria-label="Envoyer" class="fui-Button fui-SplitButton__primaryActionButton">Envoyer</button>' +
        '<button type="button" aria-label="Autres options d\'envoi">▾</button>' +
        '<button type="button" aria-label="Réglez votre sensibilité">Sensibilité</button>' +
        '<button type="button" aria-label="Abandonner" id="abandonner">Abandonner</button>' +
        '<button type="button" aria-label="Isoler">Isoler</button>' +
      '</div>' +
      '<div id="barre-erreur" role="alert"></div>' +
      '<div class="ligne" id="MSG_' + n + '_TO" role="group">' +
        '<button type="button" id="recipient-well-label-to" class="fui-Button" aria-roledescription="bouton, ouvre la boîte de dialogue Ajouter des destinataires">À</button>' +
        '<div aria-label="À" tabindex="0" class="champ EditorClass" spellcheck="false" contenteditable="true" id="a' + n + '" data-champ="a"></div>' +
        '<button type="button" id="montrer-cci" title="Afficher la ligne Cci">Cci</button>' +
      '</div>' +
      '<div class="ligne" id="MSG_' + n + '_CC" role="group">' +
        '<button type="button" id="recipient-well-label-cc" class="fui-Button" aria-roledescription="bouton, ouvre la boîte de dialogue Ajouter des destinataires">Cc</button>' +
        '<div aria-label="Cc" tabindex="0" class="champ EditorClass" spellcheck="false" contenteditable="true" data-champ="cc"></div>' +
      '</div>' +
      '<div class="ligne"><span class="fui-Input" style="flex:1"><input type="text" maxlength="255" autocomplete="off" spellcheck="true" placeholder="Ajouter un objet" aria-label="Objet" id="MSG_' + n + '_SUBJECT" data-champ="objet" style="width:100%"></span></div>' +
      '<div tabindex="0" dir="ltr" class="dFCbN customScrollBar" role="textbox" aria-multiline="true" aria-label="Corps du message" contenteditable="true" data-ms-editor="true" data-scrollable="true" data-champ="corps" id="corps">' +
        '<div class="elementToProof"><br></div><div id="Signature"><div>--</div><div>Pierre TESTEUR</div><div>Paris</div></div>' +
      '</div>' +
      '</div>';
    rubanMessage();
    importance = "normale";
    var compose = document.getElementById("compose");
    var a = compose.querySelector('[data-champ="a"]');
    champDestinataires(a, true);
    champDestinataires(compose.querySelector('[data-champ="cc"]'), false);
    compose.querySelector("#recipient-well-label-to").addEventListener("click", ouvrirCarnet);
    compose.querySelector("#recipient-well-label-cc").addEventListener("click", ouvrirCarnet);
    compose.querySelector("#montrer-cci").addEventListener("click", function () {
      var l = document.createElement("div"); l.className = "ligne"; l.id = "MSG_" + n + "_BCC"; l.setAttribute("role", "group");
      l.innerHTML = '<button type="button" id="recipient-well-label-bcc" class="fui-Button" aria-roledescription="bouton, ouvre la boîte de dialogue Ajouter des destinataires">Cci</button>' +
        '<span class="fui-Input" style="flex:1;display:flex"><div aria-label="Cci" tabindex="0" class="champ EditorClass" spellcheck="false" contenteditable="true" id="cci' + n + '" data-champ="cci"></div><input type="text" class="fui-Input__input" value="" style="display:none"></span>';
      document.getElementById("MSG_" + n + "_CC").after(l);
      this.remove();
      l.querySelector("#recipient-well-label-bcc").addEventListener("click", ouvrirCarnet);
      champDestinataires(l.querySelector('[data-champ="cci"]'), false);
    });
    var objet = compose.querySelector('[data-champ="objet"]');
    objet.addEventListener("input", function () { document.documentElement.dataset.objetSaisi = objet.value; });
    var corps = compose.querySelector('[data-champ="corps"]');
    corps.addEventListener("paste", function (e) {
      var h = e.clipboardData && e.clipboardData.getData("text/html");
      if (!h) return;
      e.preventDefault();
      document.execCommand("insertHTML", false, h);
      if (cfg.collageEnTrop) setTimeout(function () { corps.insertAdjacentHTML("afterbegin", "<div>" + "Texte ajouté par un complément. ".repeat(8) + "</div>"); }, 0);
      document.documentElement.dataset.corpsColle = String(n);
    });
    compose.querySelector("#abandonner").addEventListener("click", fermer);
    compose.querySelector("#splitButton-r200__primaryActionButton").addEventListener("click", function () {
      if (cfg.envoiBloque) return;
      var barre = compose.querySelector("#barre-erreur");
      function adressesDe(z) { var c = compose.querySelector('[data-champ="' + z + '"]'); return c ? [].map.call(c.querySelectorAll("._EType_RECIPIENT_ENTITY"), function (p) { return p.dataset.adresse; }) : []; }
      function libreDe(z) { var c = compose.querySelector('[data-champ="' + z + '"]'); if (!c) return ""; return [].filter.call(c.childNodes, function (x) { return x.nodeType === 3; }).map(function (x) { return x.nodeValue; }).join("").replace(/[​\s]/g, ""); }
      var dest = adressesDe("a"), cc = adressesDe("cc"), cci = adressesDe("cci");
      if (!dest.length && !cc.length && !cci.length) { barre.textContent = "Ajoutez au moins un destinataire."; return; }
      var invalides = [].map.call(compose.querySelectorAll("._EType_RECIPIENT_ENTITY[data-invalide]"), function (p) { return p.dataset.adresse; });
      var libres = ["a", "cc", "cci"].map(libreDe).filter(Boolean);
      if (invalides.length || libres.length) { barre.textContent = "Ce message ne peut pas être envoyé : vérifiez les noms (" + invalides.concat(libres).join(", ") + ")."; return; }
      var mail = { onglet: ONGLET, n: n, a: dest, cc: cc, cci: cci, objet: objet.value, corps: corps.innerText, html: corps.innerHTML, importance: importance, t: Date.now() };
      window.envoyes.push(mail); publier(); rapporter("envoi", mail);
      if (cfg.fermetureEnvoi > 0) setTimeout(fermer, cfg.fermetureEnvoi); else fermer();
    });
    a.focus(); // comme Outlook : le curseur est dans « À » à l'ouverture
  }
  function fermer() {
    document.getElementById("lecture").innerHTML = "";
    masquerSugg();
    rubanAccueil();
  }
})();
</script>
</body>
</html>
